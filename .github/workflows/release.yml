name: Release (tag)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG pkg=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::Tag v$TAG != package.json $PKG"; exit 1; }

      - name: Verify (full gate)
        run: npm run verify

      - name: Build release asset
        run: |
          mkdir -p dist
          cp src/igpas.user.js "dist/igpas-${GITHUB_REF_NAME}.user.js"
          cp src/igpas.user.js dist/igpas.user.js
          ls -la dist/

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

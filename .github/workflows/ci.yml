name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 = minimum supported by jsdom 30 (^22.22.2); 24 = dev version (.nvmrc).
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install deps (npm ci)
        run: npm ci

      # One single gate: syntax + lint + format + versions + guards + tests.
      # The test count is deliberately not hardcoded here (it drifted repeatedly).
      - name: Verify (syntax + lint + format + versions + guards + tests)
        run: npm run verify

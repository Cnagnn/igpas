name: Deploy Pages (docs/)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      # Quality gate — jangan deploy docs kalau codebase gagal verify
      - name: Verify (syntax + lint + format + versions + tests)
        run: npm run verify

      # Placeholder build: docs/ adalah site statis — validasi saja
      - name: Validate docs shell
        run: |
          test -f docs/index.html
          test -f docs/app/index.html
          test -f docs/gui/index.html || echo "docs/gui legacy redirect OK"
          echo "docs shell OK"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

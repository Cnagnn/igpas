version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      time: "03:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels: [deps, automated]
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [ci, automated]
